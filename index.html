<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منشئ الكتب الرسمية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<style>
:root{--bg:#f3f4f6;--card:#fff;--tx:#1f2937;--mut:#6b7280;--bd:#d1d5db;--ac:#1d4ed8;--dg:#dc2626;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111827;--card:#1f2937;--tx:#f3f4f6;--mut:#9ca3af;--bd:#374151;--ac:#60a5fa;--dg:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111827;--card:#1f2937;--tx:#f3f4f6;--mut:#9ca3af;--bd:#374151;--ac:#60a5fa;--dg:#f87171;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Naskh Arabic","Simplified Arabic","Traditional Arabic",Tahoma,Arial,sans-serif}
.app{display:grid;gap:16px;padding:12px;max-width:1300px;margin:auto}
@media(min-width:900px){.app{grid-template-columns:380px 1fr;align-items:start}.editor{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}}
.editor{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
h2{font-size:16px;margin:14px 0 6px}
h2:first-child{margin-top:0}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,textarea{width:100%;font:inherit;font-size:15px;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:6px}
.box{border:1px dashed var(--bd);border-radius:10px;padding:8px;margin:8px 0}
.box .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);margin-bottom:4px}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 14px}
.add{background:var(--bg);color:var(--ac);border:1px solid var(--ac);width:100%;margin-top:4px}
.del{background:none;color:var(--dg);padding:2px 6px}
.up{position:relative;text-align:center;color:var(--ac);border:1px solid var(--ac);border-radius:8px;padding:9px;margin-top:4px}
.up input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0}
.btns{display:flex;gap:8px;margin-top:14px}
.btns button{flex:1;background:var(--ac);color:#fff;font-size:15px;font-weight:700}
#msg{font-size:13px;color:var(--dg);margin-top:8px;min-height:18px}
.thumb{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0}
.thumb img{height:44px;border-radius:6px}
.stage{overflow:hidden}
.page{width:210mm;height:296mm;background:#fff;color:#000;padding:8mm;margin:0 auto 14px;box-shadow:0 2px 12px #0004;overflow:hidden}
.frame{height:100%;border:4px double #000;display:flex;flex-direction:column;padding:16mm 14mm 0;font-family:Arial,Tahoma,sans-serif;font-size:16pt;font-weight:700;line-height:1.7}
.frame p{margin:0}
.subject{text-align:center;margin:10px 0 18px!important}
.body p{text-align:justify;font-weight:400}
.sp{flex:1}
.closing{text-align:center;margin:12px 0 10px!important}
.att{margin-top:26px;font-size:12pt}
.att p{white-space:pre-line}
.sign{align-self:flex-end;text-align:center;min-width:55mm;margin-top:6px}
.foot{border-top:2px solid #000;margin:14px -14mm 0;padding:6px 14mm 7mm;display:grid;grid-template-columns:1fr auto 1fr;line-height:1.6}
.ip{padding:0}
.ip .frame{align-items:center;justify-content:center;padding:0;border:0;-webkit-text-stroke:0}
.ip img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.ip img.fill{width:100%;height:100%;max-width:none;max-height:none;object-fit:fill}
@media print{@page{size:A4;margin:0}html,body{background:#fff}:root{padding:0}.editor{display:none}.app{display:block;padding:0}.page{zoom:1!important;box-shadow:none;margin:0}}
</style>
</head>
<body>
<div class="app">
<div class="editor">
<h2>الجهة</h2>
<label>السيد ... المحترم (اكتب الجهة فقط)</label>
<input id="to" list="mins" placeholder="معالي وزير التربية">
<datalist id="mins"><option value="معالي وزير التربية"><option value="معالي وزير النفط"><option value="معالي وزير التعليم العالي والبحث العلمي"><option value="معالي وزير الصحة"><option value="معالي وزير الكهرباء"><option value="معالي وزير الداخلية"></datalist>
<label>الموضوع (م/)</label>
<input id="sub">

<h2>مربعات النص</h2>
<div id="boxes"></div>
<button class="add" id="addBox">+ إضافة مربع</button>

<h2>المرفقات</h2>
<label>نص المرفقات (اختياري)</label><textarea id="attT" style="min-height:60px"></textarea>
<div id="imgsList"></div>
<div class="up">+ إضافة صورة<input type="file" id="file" accept="image/*" multiple></div>

<h2>مقدم الطلب</h2>
<label>الاسم</label><input id="nm">
<label>السكن</label><input id="ad">
<label>رقم الهاتف</label><input id="ph" inputmode="tel">

<h2 style="display:none"></h2>
<input id="no" type="hidden">

<div class="btns"><button id="bPrn">طباعة</button><button id="bPdf">حفظ PDF</button><button id="bDoc">حفظ Word</button></div>
<div id="msg"></div>
</div>

<div class="stage" id="stage"><div id="pages">
<div class="page" id="page">
<div class="frame">
<p>السيد <span id="vTo"></span> المحترم</p>
<p>بــواسطة السيد النائب حسين العنكوشي المحترم</p>
<p>تحية طيبة ...</p>
<p class="subject" id="vSub"></p>
<div class="body" id="vBody"></div>
<p class="closing">ولكم فائق الشكر والتقدير والاحترام</p>
<div class="att" id="vAtt" style="display:none"></div>
<div class="sp"></div>
<div class="sign"><div>مقدم الطلب</div><div id="vNm">&nbsp;</div><div id="vPh"></div><div id="vAd"></div></div>
<div class="foot"><span id="vNo"></span><span id="vDt"></span><span></span></div>
</div>
</div>
</div></div>
</div>
<script>
var texts=[""],imgs=[];
var $=function(i){return document.getElementById(i)};
function msg(t){$("msg").textContent=t||""}
function dt(){return "التاريخ /"}
function fname(x){var n=$("nm").value.replace(/[^\w\u0600-\u06FF ]/g,"").trim();return (n||"كتاب-رسمي")+"."+x}
function attText(){var t=$("attT").value.trim();if(imgs.length)t+=(t?"\n":"")+"(الصور مرفقة في الصفحة التالية)";return t}
function render(){
$("vTo").textContent=$("to").value.trim()||".......";
$("vSub").textContent="م / "+$("sub").value;
var b=$("vBody");b.innerHTML="";
texts.forEach(function(t){if(!t.trim())return;var p=document.createElement("p");p.textContent=t;b.appendChild(p)});
$("vNm").textContent=$("nm").value||"\u00a0";
$("vAd").textContent=$("ad").value?"السكن: "+$("ad").value:"";
$("vPh").textContent=$("ph").value;
$("vNo").textContent="العدد /";
$("vDt").textContent=dt();
var a=$("vAtt"),t=attText();a.innerHTML="";a.style.display=t?"block":"none";
if(t){var p=document.createElement("p");p.textContent="المرفقات:\n"+t;a.appendChild(p)}
var old=document.querySelectorAll(".ip");for(var k=0;k<old.length;k++)old[k].remove();
for(var i=0;i<imgs.length;i+=1){
var pg=document.createElement("div");pg.className="page ip";
var f=document.createElement("div");f.className="frame";
imgs.slice(i,i+1).forEach(function(m){var e=document.createElement("img");e.src=m.s;if(Math.abs(m.w/m.h/0.7071-1)<0.15)e.className="fill";f.appendChild(e)});
pg.appendChild(f);$("pages").appendChild(pg);
}
fit();
}
function buildBoxes(){
var c=$("boxes");c.innerHTML="";
texts.forEach(function(t,i){
var d=document.createElement("div");d.className="box";
var top=document.createElement("div");top.className="top";
var s=document.createElement("span");s.textContent="مربع "+(i+1);
var x=document.createElement("button");x.className="del";x.textContent="حذف";
x.onclick=function(){texts.splice(i,1);buildBoxes();render()};
top.appendChild(s);top.appendChild(x);
var ta=document.createElement("textarea");ta.value=t;
ta.oninput=function(){texts[i]=ta.value;render()};
d.appendChild(top);d.appendChild(ta);c.appendChild(d);
});
}
function buildImgs(){
var c=$("imgsList");c.innerHTML="";
imgs.forEach(function(m,i){
var d=document.createElement("div");d.className="thumb";
var e=document.createElement("img");e.src=m.s;
var x=document.createElement("button");x.className="del";x.textContent="حذف";
x.onclick=function(){imgs.splice(i,1);buildImgs();render()};
d.appendChild(e);d.appendChild(x);c.appendChild(d);
});
}
function loadImg(f){
return new Promise(function(res){
var r=new FileReader();
r.onload=function(){
var im=new Image();
im.onload=function(){
var k=Math.min(1,1600/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k);
var c=document.createElement("canvas");c.width=w;c.height=h;
var g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,w,h);g.drawImage(im,0,0,w,h);
res({s:c.toDataURL("image/jpeg",.85),w:w,h:h});
};
im.onerror=function(){res(null)};
im.src=r.result;
};
r.onerror=function(){res(null)};
r.readAsDataURL(f);
});
}
$("file").onchange=function(e){
var fs=Array.prototype.slice.call(e.target.files);
Promise.all(fs.map(loadImg)).then(function(a){
a.forEach(function(m){if(m)imgs.push(m)});
buildImgs();render();
});
e.target.value="";
};
$("addBox").onclick=function(){texts.push("");buildBoxes();render();var a=document.querySelectorAll("#boxes textarea");a[a.length-1].focus()};
["to","sub","nm","ad","ph","no","attT"].forEach(function(i){$(i).oninput=render});
function fit(){
var w=$("stage").clientWidth,ps=document.querySelectorAll(".page");
for(var i=0;i<ps.length;i++)ps[i].style.zoom=Math.min(1,w/ps[i].offsetWidth);
}
window.addEventListener("resize",fit);

async function getDl(){
if(!window.claude||!claude.use){return {save:function(o){var a=document.createElement("a");a.href=URL.createObjectURL(o.data);a.download=o.filename;document.body.appendChild(a);a.click();a.remove();return Promise.resolve()}}}
var d=await claude.use("downloads");
if(!d)msg("الحفظ غير متاح بهذا العرض");
return d;
}
async function savePdf(){
msg("جاري تجهيز PDF ...");
try{
var dl=await getDl();if(!dl)return;
if(document.fonts)await document.fonts.ready;
var st=$("stage"),ps=document.querySelectorAll(".page"),pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4"});
st.style.overflow="visible";
for(var i=0;i<ps.length;i++){
var p=ps[i],z=p.style.zoom;p.style.zoom=1;p.style.boxShadow="none";
var c=await html2canvas(p,{scale:2,backgroundColor:"#fff",windowWidth:1000});
p.style.zoom=z;p.style.boxShadow="";
if(i)pdf.addPage();
pdf.addImage(c.toDataURL("image/jpeg",.92),"JPEG",0,0,210,297);
}
st.style.overflow="";fit();
await dl.save({filename:fname("pdf"),data:pdf.output("blob")});
msg("");
}catch(e){$("stage").style.overflow="";fit();msg(e&&e.code==="declined"?"":"تعذّر حفظ PDF")}
}
function bytes(s){var b=atob(s.split(",")[1]),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function saveWord(){
msg("جاري تجهيز Word ...");
try{
var D=window.docx;if(!D){msg("مكتبة Word ما تحمّلت");return}
var dl=await getDl();if(!dl)return;
var L=D.AlignmentType.LEFT,R=D.AlignmentType.RIGHT,C=D.AlignmentType.CENTER,J=D.AlignmentType.JUSTIFIED;
function run(t,b,s){return new D.TextRun({text:t,bold:b!==false,size:s||32,rightToLeft:true,font:"Arial"})}
function para(t,al,before,b,s){return new D.Paragraph({bidirectional:true,alignment:al,spacing:{before:before||0,after:120,line:400},children:[run(t,b,s)]})}
var ch=[para("السيد "+($("to").value.trim()||".......")+" المحترم",L),para("بواسطة السيد النائب حسين العنكوشي المحترم",L),para("تحية طيبة ...",L),para("م / "+$("sub").value,C,120)];
texts.forEach(function(t){if(t.trim())ch.push(para(t,J,0,false))});
ch.push(para("ولكم فائق الشكر والتقدير والاحترام",C,200));
var a=attText();
if(a)ch.push(para("المرفقات:",L,400,true,24)),a.split("\n").forEach(function(l){ch.push(para(l,L,0,true,24))});
ch.push(para("مقدم الطلب",R,a?600:2200));
ch.push(para($("nm").value||" ",R));
if($("ph").value)ch.push(para($("ph").value,R));
if($("ad").value)ch.push(para("السكن: "+$("ad").value,R));
var extra=imgs.map(function(m){var fill=Math.abs(m.w/m.h/0.7071-1)<0.15,w=794,h=1118;if(!fill){var k=Math.min(w/m.w,h/m.h);w=Math.round(m.w*k);h=Math.round(m.h*k)}return {properties:{page:{size:{width:11906,height:16838},margin:{top:0,bottom:0,left:0,right:0,header:0,footer:0}}},footers:{default:new D.Footer({children:[new D.Paragraph({})]})},children:[new D.Paragraph({alignment:C,spacing:{before:0,after:0},children:[new D.ImageRun({data:bytes(m.s),transformation:{width:w,height:h}})]})]}});
var bd={style:D.BorderStyle.DOUBLE,size:18,color:"000000",space:24};
var foot=new D.Footer({children:[new D.Paragraph({bidirectional:true,border:{top:{style:D.BorderStyle.SINGLE,size:8,color:"000000",space:4}},children:[run("العدد /"+"\u00a0".repeat(34)),run(dt())]})]});
var doc=new D.Document({sections:[{properties:{page:{size:{width:11906,height:16838},margin:{top:1300,bottom:1100,left:1300,right:1300,footer:600},borders:{pageBorders:{display:D.PageBorderDisplay.ALL_PAGES,offsetFrom:D.PageBorderOffsetFrom.PAGE},pageBorderTop:bd,pageBorderRight:bd,pageBorderBottom:bd,pageBorderLeft:bd}}},footers:{default:foot},children:ch}].concat(extra)});
var blob=await D.Packer.toBlob(doc);
await dl.save({filename:fname("docx"),data:blob});
msg("");
}catch(e){msg(e&&e.code==="declined"?"":"تعذّر حفظ Word")}
}
$("bPdf").onclick=savePdf;
$("bDoc").onclick=saveWord;
$("bPrn").onclick=function(){msg("");try{window.print()}catch(e){msg("الطباعة غير متاحة بهذا العرض، احفظ PDF واطبعه")}};
buildBoxes();render();
</script>
</body>
</html>
